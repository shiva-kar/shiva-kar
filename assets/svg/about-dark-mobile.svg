0" font-size="13.5" fill="#c9d1d9" text-anchor="start" >open-source software across Godot Engine in C++</text><text x="20.0" y="174.0" font-family="Inter, 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#c9d1d9" text-anchor="start" >(editor, GUI, subsystems), developer tooling, and</text><text x="20.0" y="196.0" font-family="Inter, 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#c9d1d9" text-anchor="start" >community ecosystems. Author of SXSHELL, a modular</text><text x="20.0" y="218.0" font-family="Inter, 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#c9d1d9" text-anchor="start" >POSIX shell in C (~550 lines). Based in Hojai, Assam,</text><text x="20.0" y="240.0" font-family="Inter, 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#c9d1d9" text-anchor="start" >India.</text></svg>
