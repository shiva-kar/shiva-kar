 in C (~550 lines). Based in Hojai,</text><text x="28.0" y="161.0" font-family="Inter, 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14" fill="#c9d1d9" text-anchor="start" >Assam, India.</text></svg>
