0" y="164.0" font-family="Inter, 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#c7cfc5" text-anchor="start" >across editor, GUI, GDScript, and web-platform</text><text x="20.0" y="186.0" font-family="Inter, 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#c7cfc5" text-anchor="start" >subsystems in C++ (13 pull requests submitted, 6</text><text x="20.0" y="208.0" font-family="Inter, 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#c7cfc5" text-anchor="start" >merged). I am also interested in systems programming</text><text x="20.0" y="230.0" font-family="Inter, 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#c7cfc5" text-anchor="start" >in C, POSIX APIs, and graphics rendering.</text></svg>
