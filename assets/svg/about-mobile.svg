<svg xmlns="http://www.w3.org/2000/svg" width="400" height="273.5" viewBox="0 0 400 273.5" role="img"><style>@font-face{font-family:'Inter';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0.5" y="0.5" width="399.0" height="272.5" rx="12" fill="#0d1117" stroke="#21262d"/><text x="22.0" y="38.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="14.5" fill="#c9d1d9" text-anchor="start" >BCA Computer Science student at Amity University</text><text x="22.0" y="61.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="14.5" fill="#c9d1d9" text-anchor="start" >Online (CGPA 8.84/10), building Java backends</text><text x="22.0" y="84.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="14.5" fill="#c9d1d9" text-anchor="start" >with Spring Boot, PostgreSQL, and Redis. I also</text><text x="22.0" y="107.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="14.5" fill="#c9d1d9" text-anchor="start" >work with React and TypeScript on the frontend</text><text x="22.0" y="130.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="14.5" fill="#c9d1d9" text-anchor="start" >when needed. In my own time, I contribute bug</text><text x="22.0" y="153.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="14.5" fill="#c9d1d9" text-anchor="start" >fixes to Godot Engine across editor, GUI, GDScript,</text><text x="22.0" y="176.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="14.5" fill="#c9d1d9" text-anchor="start" >and web-platform subsystems in C++ (13 pull</text><text x="22.0" y="199.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="14.5" fill="#c9d1d9" text-anchor="start" >requests submitted, 6 merged). I am also interested</text><text x="22.0" y="222.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="14.5" fill="#c9d1d9" text-anchor="start" >in systems programming in C, POSIX APIs, and</text><text x="22.0" y="245.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="14.5" fill="#c9d1d9" text-anchor="start" >graphics rendering.</text></svg>