<svg xmlns="http://www.w3.org/2000/svg" width="880" height="187.5" viewBox="0 0 880 187.5" role="img"><style>@font-face{font-family:'Inter';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0.5" y="0.5" width="879.0" height="186.5" rx="12" fill="#0d1117" stroke="#21262d"/><text x="32.0" y="49.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="15.5" fill="#c9d1d9" text-anchor="start" >BCA Computer Science student at Amity University Online (CGPA 8.84/10), building Java backends with Spring</text><text x="32.0" y="74.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="15.5" fill="#c9d1d9" text-anchor="start" >Boot, PostgreSQL, and Redis. I also work with React and TypeScript on the frontend when needed. In my own</text><text x="32.0" y="99.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="15.5" fill="#c9d1d9" text-anchor="start" >time, I contribute bug fixes to Godot Engine across editor, GUI, GDScript, and web-platform subsystems in C++</text><text x="32.0" y="124.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="15.5" fill="#c9d1d9" text-anchor="start" >(13 pull requests submitted, 6 merged). I am also interested in systems programming in C, POSIX APIs, and</text><text x="32.0" y="149.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="400" font-size="15.5" fill="#c9d1d9" text-anchor="start" >graphics rendering.</text></svg>
