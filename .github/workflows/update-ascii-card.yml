name: Refresh gh-ascii card

on:
  schedule:
    # Runs every 6 hours to keep stats, contributions, and uptime fresh
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: profile-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest SVGs and apply rendering fixes
        run: |
          set -euo pipefail

          curl -fL --retry 3 --retry-delay 5 "https://gh.crafter.run/shiva-kar?theme=dark" -o dark_mode.svg.tmp
          curl -fL --retry 3 --retry-delay 5 "https://gh.crafter.run/shiva-kar?theme=light" -o light_mode.svg.tmp

          python3 - << 'EOF'
          from pathlib import Path
          import re
          import sys

          for name in ("dark_mode.svg", "light_mode.svg"):
              tmp_path = Path(f"{name}.tmp")
              content = tmp_path.read_text(encoding="utf-8")

              if not content.lstrip().startswith("<svg") or "</svg>" not in content:
                  print(f"Error: {name} is not a valid SVG", file=sys.stderr)
                  sys.exit(1)

              # Fix double-escaped entity bug in gh.crafter.run output
              content = content.replace("&amp;gt;", "&gt;")

              # Prevent the 52-week contribution sparkline from overflowing the right border
              content = re.sub(
                  r'(<text x="540" y="473\.4")(\s+font-family=)',
                  r'\1 textLength="510" lengthAdjust="spacingAndGlyphs"\2',
                  content,
              )

              Path(name).write_text(content, encoding="utf-8")
              tmp_path.unlink()

          import shutil
          shutil.copyfile("dark_mode.svg", "assets/svg/banner-dark.svg")
          shutil.copyfile("light_mode.svg", "assets/svg/banner-light.svg")
          EOF

      - name: Commit or amend changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg assets/svg/banner-dark.svg assets/svg/banner-light.svg

          if git diff --staged --quiet; then
            echo "No changes in profile stats or info."
            exit 0
          fi

          LAST_AUTHOR="$(git log -1 --pretty=format:'%an')"
          LAST_SUBJECT="$(git log -1 --pretty=format:'%s')"

          if [ "$LAST_AUTHOR" = "github-actions[bot]" ] || [[ "$LAST_SUBJECT" =~ ^chore(\(.*\))?: ]]; then
            echo "Previous commit is a bot chore ('$LAST_SUBJECT' by $LAST_AUTHOR) — squeezing changes into it."
            git commit --amend -m "chore: refresh profile stats and cards [skip ci]" --reset-author
            if ! git push --force-with-lease origin main; then
              echo "Force push with lease failed (remote updated). Pulling rebase and pushing."
              git pull --rebase origin main
              git push origin main
            fi
          else
            echo "Previous commit is user work ('$LAST_SUBJECT' by $LAST_AUTHOR) — creating new chore commit."
            git commit -m "chore: refresh profile stats and cards [skip ci]"
            git push origin main
          fi
