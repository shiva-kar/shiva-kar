name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *" # Daily 3:00 AM UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - requirements.txt
      - .github/workflows/update-profile.yml

concurrency:
  group: update-profile-cards
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch GitHub data
        run: python scripts/fetch-data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render SVG cards and README
        run: python scripts/render-svgs.py

      - name: Validate output quality and links
        run: python scripts/validate.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/svg/ data/profile.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile cards"
            git pull --rebase --autostash origin main
            git push
          else
            echo "No changes to commit"
          fi
