name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *" # Daily 3:00 AM UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - requirements.txt
      - .github/workflows/update-profile.yml

concurrency:
  group: profile-repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch GitHub data
        run: python scripts/fetch-data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render SVG cards and README
        run: python scripts/render-svgs.py

      - name: Validate output quality and links
        run: python scripts/validate.py

      - name: Commit or amend changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/svg/ data/profile.json README.md dark_mode.svg light_mode.svg
          if git diff --staged --quiet; then
            echo "No changes in profile cards or data to commit."
            exit 0
          fi

          LAST_AUTHOR="$(git log -1 --pretty=format:'%an')"
          LAST_SUBJECT="$(git log -1 --pretty=format:'%s')"

          if [ "$LAST_AUTHOR" = "github-actions[bot]" ] || [[ "$LAST_SUBJECT" =~ ^chore(\(.*\))?: ]]; then
            echo "Previous commit is a bot chore ('$LAST_SUBJECT' by $LAST_AUTHOR) — squeezing changes into it."
            git commit --amend -m "chore: refresh profile stats and cards [skip ci]" --reset-author
            if ! git push --force-with-lease origin main; then
              echo "Force push with lease failed (remote updated). Pulling rebase and pushing."
              git pull --rebase origin main
              git push origin main
            fi
          else
            echo "Previous commit is user work ('$LAST_SUBJECT' by $LAST_AUTHOR) — creating new chore commit."
            git commit -m "chore: refresh profile stats and cards [skip ci]"
            git push origin main
          fi
